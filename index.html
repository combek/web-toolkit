<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex-Dev-Web-C-DE | Project Manager</title>
    <!-- Підключаємо Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #0d1117;
            color: #c9d1d9;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { margin: 0; font-size: 24px; color: #58a6ff; }
        button {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background-color: #2ea043; }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Alex-Dev-Web-C-DE</h1>
        <div id="auth-container">
            <button id="login-btn" onclick="loginWithGitHub()">Увійти через GitHub</button>
        </div>
    </header>

    <main>
        <div class="card">
            <h2>⚙️ Профілі налаштувань та маски</h2>
            <p>Тут буде управління правилами та збереження вашої хмарної конфігурації.</p>
        </div>
    </main>

    <script>
        // Підключення до вашого хмарного проєкта Supabase
        const SUPABASE_URL = 'https://kysudytgzemgxmtkhcab.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_KlDzrU7imN6UrIX2mk0DhA__KbBT6B_';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Функція входу через GitHub
        async function loginWithGitHub() {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'github',
                options: {
                    redirectTo: window.location.origin
                }
            });
            if (error) console.error('Помилка входу:', error.message);
        }

        // Перевірка стану сесії при завантаженні сторінки
        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authContainer = document.getElementById('auth-container');
            
            if (session) {
                authContainer.innerHTML = `
                    <span>Вітаю, <b>${session.user.user_metadata.user_name || session.user.email}</b></span>
                    <button onclick="logout()" style="background-color: #da3633; margin-left: 10px;">Вийти</button>
                `;
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        // Викликаємо перевірку при завантаженні
        checkUserSession();
    </script>
</body>
</html>
