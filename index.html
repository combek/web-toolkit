<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інструментарій Python та веб-автоматизації</title>
    <link rel="stylesheet" href="style.css">
    <!-- Бібліотека JSZip для генерації архівів на клієнті -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Інструментарій Python та веб-автоматизації</h1>
            <p>Утиліта для мікросервісів автоматизації виробничого рівня та організації файлів.</p>
        </header>

        <main>
            <section class="card">
                <h2>📁 Організатор структури файлів</h2>
                
                <!-- Кнопки швидких пресетів -->
                <p>Швидкі пресети проєктів:</p>
                <div class="presets" style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap;">
                    <button type="button" onclick="loadPreset('python')" style="background-color: #334155; font-size: 12px; padding: 6px 10px; width: auto;">🐍 Python Stack</button>
                    <button type="button" onclick="loadPreset('web')" style="background-color: #334155; font-size: 12px; padding: 6px 10px; width: auto;">🌐 Web / React</button>
                    <button type="button" onclick="loadPreset('data')" style="background-color: #334155; font-size: 12px; padding: 6px 10px; width: auto;">📊 Data Science</button>
                </div>

                <p>Введіть імена файлів, розділені комами:</p>
                <input type="text" id="fileInput" placeholder="документ.pdf, фото.png, скрипт.py, архів.zip">

                <p>Ігнорувати файли/маски (через кому):</p>
                <input type="text" id="ignoreInput" placeholder=".env, node_modules, temp.*">

                <button onclick="organizeFiles()">Сортувати файли</button>
                
                <div id="output" class="output"></div>
                
                <div id="actionButtons" style="display: none; margin-top: 15px; display: flex; gap: 10px;">
                    <button id="downloadZipBtn" onclick="downloadZip()" style="background-color: #0284c7; color: white; flex: 1;">Завантажити ZIP-архів</button>
                    <button id="copyTreeBtn" onclick="copyProjectTree()" style="background-color: #334155; color: white; flex: 1;">Скопіювати схему (Markdown)</button>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
