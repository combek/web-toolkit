<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Automation Toolkit | Portfolio Preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Python & Web Automation Toolkit</h1>
            <p>Демонстрація мікросервісів та інструментів автоматизації для портфоліо.</p>
        </header>

        <main>
            <section class="card">
                <h2>📁 Генератор структури / Організайзер файлів</h2>
                <p>Введіть список файлів через кому, щоб побачити, як алгоритм сортує їх за типами.</p>
                <input type="text" id="fileInput" placeholder="document.pdf, photo.png, script.py, archive.zip">
                <button onclick="organizeFiles()">Сортувати</button>
                <div id="output" class="output"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
