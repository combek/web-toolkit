<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Automation Toolkit | Professional SaaS Platform</title>
    <link rel="stylesheet" href="style.css">
    <!-- JSZip Library for client-side archive generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Python & Web Automation Toolkit</h1>
            <p>Production-grade automation microservices and file organization utility.</p>
        </header>

        <main>
            <section class="card">
                <h2>📁 File Structure Organizer</h2>
                <p>Enter file names separated by commas to sort and structure them automatically.</p>
                <input type="text" id="fileInput" placeholder="document.pdf, photo.png, script.py, archive.zip">
                <button onclick="organizeFiles()">Sort Files</button>
                
                <div id="output" class="output"></div>
                
                <!-- New Download ZIP Button -->
                <button id="downloadZipBtn" onclick="downloadZip()" style="display: none; margin-top: 15px; background-color: #2ea44f; color: white;">Download ZIP Archive</button>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
